name: floor_calculator
description: Calculadora de pisos e revestimentos para pedreiros e construção civil.
publish_to: 'none'
version: 5.0.0+5

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_mobile_ads: ^5.3.1
  intl: any
  lucid_validation: ^1.2.4
  share_plus: ^10.1.2
  toastification: ^2.3.0
  sensors_plus: ^6.1.1
  flutter_compass: ^0.8.1
  torch_light: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  alchemist: ^0.12.1
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/logo_1024.png"
  adaptive_icon_background: "#FF5722"
  adaptive_icon_foreground: "assets/branding/icon_foreground_1024.png"
  min_sdk_android: 21

flutter_native_splash:
  # Cores extraídas de ColorScheme.fromSeed(seedColor: Colors.deepOrange)
  # para combinar com a cor de superfície do Scaffold (sem "flash" na transição
  # splash → primeiro frame do app).
  #
  # Se mudar a seed do tema em lib/core/theme_app.dart, rode
  #   flutter test tool/print_theme_colors.dart
  # para descobrir as novas cores e atualize aqui.
  color: "#FFF8F6"       # ColorScheme.light.surface
  color_dark: "#1A110F"  # ColorScheme.dark.surface
  image: assets/branding/splash_512.png
  image_dark: assets/branding/splash_512.png
  android_12:
    image: assets/branding/icon_foreground_1024.png
    color: "#FFF8F6"
    image_dark: assets/branding/icon_foreground_1024.png
    color_dark: "#1A110F"
  android: true
  ios: true
