<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE0D6"/>
    </linearGradient>
    <linearGradient id="tileAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0D6"/>
      <stop offset="100%" stop-color="#FFCCBC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 3x3 grid of tiles (checkered) -->
  <g filter="url(#shadow)">
    <!-- Row 1 -->
    <rect x="220" y="220" width="180" height="180" rx="22" fill="url(#tile)"/>
    <rect x="422" y="220" width="180" height="180" rx="22" fill="url(#tileAccent)"/>
    <rect x="624" y="220" width="180" height="180" rx="22" fill="url(#tile)"/>
    <!-- Row 2 -->
    <rect x="220" y="422" width="180" height="180" rx="22" fill="url(#tileAccent)"/>
    <rect x="422" y="422" width="180" height="180" rx="22" fill="url(#tile)"/>
    <rect x="624" y="422" width="180" height="180" rx="22" fill="url(#tileAccent)"/>
    <!-- Row 3 -->
    <rect x="220" y="624" width="180" height="180" rx="22" fill="url(#tile)"/>
    <rect x="422" y="624" width="180" height="180" rx="22" fill="url(#tileAccent)"/>
    <rect x="624" y="624" width="180" height="180" rx="22" fill="url(#tile)"/>
  </g>

  <!-- Equals sign in center tile -->
  <g fill="#E64A19">
    <rect x="446" y="486" width="132" height="28" rx="14"/>
    <rect x="446" y="538" width="132" height="28" rx="14"/>
  </g>

  <!-- Subtle measurement marks in corner tiles to suggest "calculation/measurement" -->
  <g fill="#E64A19" opacity="0.55">
    <!-- top-left small ruler ticks -->
    <rect x="248" y="368" width="6" height="22" rx="2"/>
    <rect x="276" y="368" width="6" height="14" rx="2"/>
    <rect x="304" y="368" width="6" height="22" rx="2"/>
    <rect x="332" y="368" width="6" height="14" rx="2"/>
    <rect x="360" y="368" width="6" height="22" rx="2"/>
    <!-- bottom-right small ruler ticks (vertical) -->
    <rect x="772" y="652" width="22" height="6" rx="2"/>
    <rect x="772" y="680" width="14" height="6" rx="2"/>
    <rect x="772" y="708" width="22" height="6" rx="2"/>
    <rect x="772" y="736" width="14" height="6" rx="2"/>
    <rect x="772" y="764" width="22" height="6" rx="2"/>
  </g>
</svg>
